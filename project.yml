name: QuickStyles
options:
  bundleIdPrefix: birchtree
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.1
settings:
  base:
    DEVELOPMENT_TEAM: ZPU7B69KH3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  QuickStyles:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - target: QuickStylesExtension
        embed: true
        codeSign: true
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Quick Styles
        PRODUCT_BUNDLE_IDENTIFIER: birchtree.quick-styles
        CODE_SIGN_ENTITLEMENTS: App/QuickStyles.entitlements
        # The app itself isn't sandboxed (it ships outside the App Store, and
        # this keeps Sparkle simple). The Safari extension is sandboxed.
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quick Styles
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License. Free and open source."
  QuickStylesExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension
        excludes:
          - Resources
      # Safari wants manifest.json and friends at the top of the extension's
      # Resources, so these are copied as individual files (no subfolders).
      - path: Extension/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Quick Styles Extension
        PRODUCT_BUNDLE_IDENTIFIER: birchtree.quick-styles.Extension
        CODE_SIGN_ENTITLEMENTS: Extension/QuickStylesExtension.entitlements
        ENABLE_APP_SANDBOX: YES
        INFOPLIST_FILE: Extension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quick Styles
        SKIP_INSTALL: YES
