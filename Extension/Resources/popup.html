<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <script src="shared.js"></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <div class="scope" role="tablist" aria-label="Where this CSS applies">
      <button id="tab-site" role="tab" aria-selected="true">This site</button>
      <button id="tab-global" role="tab" aria-selected="false">All sites</button>
    </div>
    <label class="switch" title="Turn these styles on or off">
      <input id="enabled" type="checkbox" checked>
      <span class="track"><span class="thumb"></span></span>
      <span class="sr-only">Styles on</span>
    </label>
  </header>

  <p id="target" class="target"></p>

  <textarea id="css" spellcheck="false" autocapitalize="off" autocomplete="off"
    placeholder="/* Your CSS goes here */&#10;body {&#10;  font-family: Georgia, serif;&#10;}"></textarea>

  <p id="notice" class="notice" hidden></p>

  <footer>
    <span id="status" class="status" aria-live="polite"></span>
    <button id="manage" class="link">Manage all styles</button>
  </footer>
</body>
</html>
